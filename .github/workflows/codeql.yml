name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: github/codeql-action/init@4110a988ca85d436f1ad69dd90aed6222a6ac39e  # v3.30.6
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@4110a988ca85d436f1ad69dd90aed6222a6ac39e  # v3.30.6
      - uses: github/codeql-action/analyze@4110a988ca85d436f1ad69dd90aed6222a6ac39e  # v3.30.6
        with:
          category: "/language:${{ matrix.language }}"
