name: Bug report
description: Report a defect in the platform or in a built-in feature
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below.
        For security issues, do **not** use this form — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps a maintainer can run to see the bug.
      placeholder: |
        1. Run `make dev-up`
        2. Hit `POST /api/v1/...`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs, stack traces, screenshots if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit SHA
      placeholder: v0.1.0 or abcd1234
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / UI
        - Agents
        - AI gateway
        - Plugins / contract
        - Auth / security
        - Database / migrations
        - Infra / deployment
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, Docker version, deployment mode.
      placeholder: |
        OS: Ubuntu 24.04
        Python: 3.12.3
        Node: 22.11
        Docker: 27.3
