name: Feature request
description: Suggest an enhancement to the platform or plugin contract
title: "[feature] "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Before opening, please check Discussions for similar proposals.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the platform do? Sketch the API or UX if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried? Why are they insufficient?
  - type: dropdown
    id: scope
    attributes:
      label: Where does this belong?
      options:
        - Core platform
        - Plugin contract change
        - Could be a plugin (no core change needed)
        - Docs / examples
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this.
        - label: I am willing to help test a PR for this.
