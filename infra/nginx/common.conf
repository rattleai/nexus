# ── Security headers ──────────────────────────────────
add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header X-XSS-Protection        "1; mode=block" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Uncomment with TLS:
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ── Gzip compression ─────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ── Client body size ─────────────────────────────────
client_max_body_size 50M;

# ── API routes ────────────────────────────────────────
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://api_backend;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
}

# ── Static assets (long cache) ───────────────────────
location /assets/ {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;

    expires 1y;
    add_header Cache-Control "public, immutable";
}

# ── SPA catch-all ────────────────────────────────────
location / {
    proxy_pass http://api_backend;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Health check (no rate limit) ─────────────────────
location = /api/v1/health/live {
    proxy_pass http://api_backend;
    access_log off;
}
