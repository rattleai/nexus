# ── Security headers ──────────────────────────────────
add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header X-XSS-Protection        "1; mode=block" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), publickey-credentials-get=self" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss: ws:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS: browsers ignore this header over plain HTTP (RFC 6797 §7.2),
# so it's safe to include unconditionally. Active only when TLS server block is enabled.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ── Gzip compression ─────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

# ── Client body size ─────────────────────────────────
client_max_body_size 50M;

# ── WebSocket endpoint ───────────────────────────────
location /api/v1/ws {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# ── Auth routes (stricter rate limit) ─────────────────
location /api/v1/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;

    proxy_pass http://api_backend;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
}

# ── API documentation (relaxed CSP for Swagger UI / ReDoc CDN assets) ─
location ~ ^/api/(docs|redoc)$ {
    proxy_pass http://api_backend;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # Override global security headers — nginx drops parent add_header in child blocks,
    # so we must re-include every header we still want.
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), publickey-credentials-get=self" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
}

# ── OpenAPI JSON spec (no CSP relaxation needed, just JSON) ──────────
location = /api/v1/openapi.json {
    proxy_pass http://api_backend;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
}

# ── API routes ────────────────────────────────────────
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://api_backend;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
}

# ── Static assets (long cache, pre-compressed) ───────
location /assets/ {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;

    gzip_static on;
    # brotli_static on;  # Uncomment when using ngx_brotli module

    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";

    # Re-include security headers (nginx drops parent add_header in child blocks)
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}

# ── PWA manifest & service worker ────────────────────
location /manifest.webmanifest {
    proxy_pass http://api_backend;
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Type "application/manifest+json";
}

location /sw.js {
    proxy_pass http://api_backend;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
}

# ── SPA catch-all ────────────────────────────────────
location / {
    proxy_pass http://api_backend;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Health check (no rate limit) ─────────────────────
location = /api/v1/health/live {
    proxy_pass http://api_backend;
    access_log off;
}
