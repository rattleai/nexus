upstream api_backend {
    server api:8000;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # ── TLS redirect ──
    # When TLS is configured, uncomment the next line to redirect all HTTP → HTTPS:
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/common.conf;
}

# ── TLS server block ──
# To enable HTTPS:
# 1. Mount your cert/key into the container (e.g. via Docker volumes or secrets)
# 2. Uncomment the block below and set server_name to your domain
# 3. Uncomment the HTTP→HTTPS redirect above
