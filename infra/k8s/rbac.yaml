# Explicit zero-permission Role + RoleBinding for the nxs ServiceAccount.
# Ensures that even if automountServiceAccountToken is later enabled,
# the SA has no permissions by default (least-privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nxs-no-permissions
  namespace: nxs
  labels:
    app.kubernetes.io/part-of: nxs
# rules intentionally empty — grants zero permissions
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nxs-no-permissions
  namespace: nxs
  labels:
    app.kubernetes.io/part-of: nxs
subjects:
  - kind: ServiceAccount
    name: nxs
    namespace: nxs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nxs-no-permissions
