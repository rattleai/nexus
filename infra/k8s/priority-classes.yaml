# PriorityClasses ensure API pods survive resource pressure over batch jobs.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cadprice-critical
  labels:
    app.kubernetes.io/part-of: cadprice
value: 1000000
globalDefault: false
description: "Critical priority for CADPrice API servers — evicted last."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cadprice-standard
  labels:
    app.kubernetes.io/part-of: cadprice
value: 500000
globalDefault: false
description: "Standard priority for CADPrice workers and beat scheduler."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cadprice-batch
  labels:
    app.kubernetes.io/part-of: cadprice
value: 100000
globalDefault: false
description: "Low priority for CADPrice batch/one-off jobs — evicted first."
