apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadprice-worker
  namespace: cadprice
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: cadprice
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: cadprice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: cadprice
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: cadprice
      automountServiceAccountToken: false
      priorityClassName: cadprice-standard
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
              app.kubernetes.io/part-of: cadprice
      containers:
        - name: worker
          image: ghcr.io/OWNER/cadprice:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.workers.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            - default,agents,billing
          envFrom:
            - configMapRef:
                name: cadprice-config
            - secretRef:
                name: cadprice-secrets
          env:
            - name: PYTHONPATH
              value: /app
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.workers.celery_app
                - inspect
                - ping
                - --timeout
                - "5"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - celery
                - -A
                - app.workers.celery_app
                - inspect
                - ping
                - --timeout
                - "5"
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 200Mi
---
# P1-3: PodDisruptionBudget for workers
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cadprice-worker-pdb
  namespace: cadprice
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: cadprice
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: cadprice
