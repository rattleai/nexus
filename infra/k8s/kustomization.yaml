apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cadprice

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - worker-deployment.yaml
  - beat-deployment.yaml
  - ingress.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/OWNER/cadprice
    # IMPORTANT: Replace with immutable tag (git SHA or semver) before production deploy.
    # Example: newTag: sha-abc1234f or newTag: v1.2.3
    newTag: latest
