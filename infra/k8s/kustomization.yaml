apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cadprice

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - worker-deployment.yaml
  - beat-deployment.yaml
  - ingress.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/OWNER/cadprice
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: cadprice
