# PgBouncer connection pooler configuration.
# Deploy as a sidecar or standalone service for connection multiplexing.
#
# Usage as sidecar: add this container to api-deployment.yaml and worker-deployment.yaml
# and point DATABASE_URL to localhost:6432 instead of the direct DB host.
#
# Standalone: create a Deployment + Service using this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: nxs
  labels:
    app.kubernetes.io/part-of: nxs
    app.kubernetes.io/component: database
data:
  pgbouncer.ini: |
    [databases]
    nxs = host=${DB_HOST} port=5432 dbname=nxs

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 200
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    server_lifetime = 300
    server_idle_timeout = 60
    server_connect_timeout = 10
    server_login_retry = 1
    query_timeout = 30
    query_wait_timeout = 30
    client_idle_timeout = 300
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60
    ignore_startup_parameters = extra_float_digits,options
