apiVersion: apps/v1
kind: Deployment
metadata:
  name: nxs-beat
  namespace: nxs
  labels:
    app.kubernetes.io/name: beat
    app.kubernetes.io/part-of: nxs
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    # Recreate to prevent duplicate beat schedulers
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beat
      app.kubernetes.io/part-of: nxs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beat
        app.kubernetes.io/part-of: nxs
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: nxs
      automountServiceAccountToken: false
      priorityClassName: nxs-standard
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: ghcr.io/OWNER/nxs:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.workers.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: nxs-config
            - secretRef:
                name: nxs-secrets
          env:
            - name: PYTHONPATH
              value: /app
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 250m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
---
# P1-3: PodDisruptionBudget for beat
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nxs-beat-pdb
  namespace: nxs
  labels:
    app.kubernetes.io/name: beat
    app.kubernetes.io/part-of: nxs
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beat
      app.kubernetes.io/part-of: nxs
