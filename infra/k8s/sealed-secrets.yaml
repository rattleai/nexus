# ─────────────────────────────────────────────────────────────────────────────
# CADPrice SealedSecrets Manifest (Production)
# ─────────────────────────────────────────────────────────────────────────────
#
# SealedSecrets encrypts secrets client-side so they can be safely committed
# to version control. Only the cluster's SealedSecrets controller can decrypt.
#
# PREREQUISITES:
#   1. Install the SealedSecrets controller in your cluster:
#        helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#        helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
#
#   2. Install kubeseal CLI:
#        brew install kubeseal   # macOS
#
# USAGE:
#   1. Create a plain secrets.yaml from the template:
#        cp secrets.yaml.template secrets.yaml
#        # Edit secrets.yaml with real values
#
#   2. Seal the secret:
#        kubeseal --format yaml \
#          --controller-name sealed-secrets \
#          --controller-namespace kube-system \
#          < secrets.yaml > sealed-secrets.yaml
#
#   3. Commit the sealed version (this file) to git.
#      Delete the plain secrets.yaml — it must never be committed.
#
#   4. Apply to cluster:
#        kubectl apply -f sealed-secrets.yaml
#
#   The SealedSecrets controller will decrypt it into a regular Secret
#   named "cadprice-secrets" in the "cadprice" namespace.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cadprice-secrets
  namespace: cadprice
  labels:
    app.kubernetes.io/part-of: cadprice
spec:
  encryptedData:
    # Run kubeseal to populate this section.
    # Each key will contain the base64-encoded, encrypted value.
    # Example (after running kubeseal):
    #   DATABASE_URL: AgBy3i4OJSWK+PiTySYZZA9rO...
    {}
  template:
    metadata:
      name: cadprice-secrets
      namespace: cadprice
      labels:
        app.kubernetes.io/part-of: cadprice
    type: Opaque
