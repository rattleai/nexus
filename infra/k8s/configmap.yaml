apiVersion: v1
kind: ConfigMap
metadata:
  name: cadprice-config
  namespace: cadprice
  labels:
    app.kubernetes.io/part-of: cadprice
data:
  # Application
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"
  CORS_ORIGINS: "https://cadprice.com,https://www.cadprice.com"
  APP_BASE_URL: "https://cadprice.com"

  # Rate limiting
  RATE_LIMIT_DEFAULT: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_AUTH_ENDPOINTS: "10"
  RATE_LIMIT_UPLOADS: "20"
  RATE_LIMIT_AI_REQUESTS: "60"

  # Request size limits
  MAX_REQUEST_BODY_BYTES: "1048576"
  MAX_UPLOAD_SIZE_BYTES: "52428800"

  # Caching
  CACHE_ENABLED: "true"
  CACHE_DEFAULT_TTL: "300"

  # Database
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  DATABASE_SSL_MODE: "require"

  # OpenTelemetry
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "cadprice"
  OTEL_EXPORTER_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"

  # Auth
  AUTH_ENABLED: "true"
  JWT_ALGORITHM: "RS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # Email
  BREVO_SENDER_EMAIL: "noreply@cadprice.com"
  BREVO_SENDER_NAME: "CAD Price"
  EMAIL_VERIFICATION_EXPIRE_HOURS: "24"
  PASSWORD_RESET_EXPIRE_HOURS: "1"

  # S3 / Storage
  S3_REGION: "auto"
  S3_BUCKET: "uploads"

  # AI Gateway
  AI_ENABLED: "true"
  AI_REQUEST_TIMEOUT_SECONDS: "30"
  AI_MAX_TOKENS_PER_REQUEST: "128000"
  AI_MAX_MESSAGES_PER_REQUEST: "100"
  AI_MAX_MESSAGE_LENGTH: "200000"
  AI_MARGIN_PLATFORM_KEYS: "1.20"
  AI_MARGIN_BYOK_KEYS: "1.05"
  AI_WALLET_LOW_BALANCE_THRESHOLD: "1000"
  AI_CACHE_ENABLED: "true"
  AI_CACHE_TTL_SECONDS: "3600"
  AI_DEFAULT_FALLBACK_ENABLED: "true"

  # WebAuthn
  WEBAUTHN_RP_ID: "cadprice.com"
  WEBAUTHN_RP_NAME: "CAD Price"
  WEBAUTHN_ORIGIN: "https://cadprice.com"

  # Push notifications
  VAPID_MAILTO: "admin@cadprice.com"
