{% if flash_messages is defined %}
{% for msg in flash_messages %}
<div x-data="flash" x-show="show" x-transition
     class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2"
     role="alert">
    <div class="rounded-btn p-4 flex items-center justify-between
                {% if msg.level == 'success' %}bg-green-50 text-green-800 border border-green-200
                {% elif msg.level == 'error' %}bg-red-50 text-red-800 border border-red-200
                {% elif msg.level == 'warning' %}bg-yellow-50 text-yellow-800 border border-yellow-200
                {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
        <span>{{ msg.text }}</span>
        <button @click="dismiss()" class="ml-4 text-sm underline cursor-pointer" aria-label="Dismiss notification">
            Dismiss
        </button>
    </div>
</div>
{% endfor %}
{% endif %}
