services:
  # ── Core Services ────────────────────────────────────────
  api:
    build: .
    ports:
      - "127.0.0.1:8002:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://app:app@pgbouncer:6432/app
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health/live\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: sh -c "alembic upgrade head && python -m scripts.seed_dev && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    stop_grace_period: 30s
    restart: unless-stopped
    profiles: ["core"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_API_URL=http://api:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["core"]

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles: ["core"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── PgBouncer connection pooler ──────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_RESET_QUERY: "DISCARD ALL"
      AUTH_TYPE: plain
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U app || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles: ["core"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-changeme} ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles: ["core"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Async Workers ────────────────────────────────────────
  worker:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://app:app@pgbouncer:6432/app
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 60s
    restart: unless-stopped
    profiles: ["async"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  beat:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://app:app@pgbouncer:6432/app
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    stop_grace_period: 10s
    restart: unless-stopped
    profiles: ["async"]

  agent-worker:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - AGENT_EXECUTION_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://app:app@pgbouncer:6432/app
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info -Q agents --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 120s
    restart: unless-stopped
    profiles: ["agents"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ── MCP Server ───────────────────────────────────────────
  mcp:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - MCP_ENABLED=true
      - MCP_TRANSPORT=http
      - DATABASE_URL=postgresql+asyncpg://app:app@pgbouncer:6432/app
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: cadprice-mcp
    stop_grace_period: 10s
    restart: unless-stopped
    profiles: ["mcp"]

  # ── Observability ────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles: ["observability"]

volumes:
  pgdata:
