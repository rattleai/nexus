[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-platform"
version = "0.1.0"
description = "Generic multi-tenant SaaS platform template — FastAPI backend with React frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<6",
    "boto3>=1.36,<2",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.18,<1",
    "passlib>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/deps.py" = ["B008"]  # Depends() in defaults is idiomatic FastAPI
