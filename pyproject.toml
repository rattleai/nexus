[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-platform"
version = "0.1.0"
description = "Generic multi-tenant SaaS platform template — FastAPI backend with React frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.14,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "celery[redis]>=5.4,<6",
    "celery-redbeat>=2.2,<3",
    "redis>=5.2,<6",
    "boto3>=1.36,<2",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.18,<1",
    "passlib[argon2]>=1.7,<2",
    "argon2-cffi>=23.1,<24",
    "bcrypt>=4.0,<5",
    "PyJWT>=2.8,<3",
    "structlog>=24.4,<26",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp>=1.24,<2",
    "opentelemetry-instrumentation-fastapi>=0.45b,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b,<1",
    "opentelemetry-instrumentation-redis>=0.45b,<1",
    "opentelemetry-instrumentation-celery>=0.45b,<1",
    "prometheus-client>=0.20,<1",
    "opentelemetry-exporter-prometheus>=0.45b,<1",
    "stripe>=8.0,<12",
    "cryptography>=42.0,<45",
    "litellm>=1.55,<2",
    "tiktoken>=0.8,<1",
    "sse-starlette>=2.0,<3",
    # Mobile-first: push notifications & biometric auth
    "pywebpush>=2.0,<3",
    "py-vapid>=1.9,<2",
    "webauthn>=2.0,<3",
    "websockets>=15.0,<16",
    "fastmcp>=3.1,<4",
    "fastapi-mcp>=0.3,<1",
    # Document processing pipeline
    "pdfplumber>=0.11,<1",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "markdownify>=0.13,<1",
    "python-magic>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=5.0,<6",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.8,<2",
    "pact-python>=2.2,<3",
]
cli = [
    "typer>=0.12,<1",
    "rich>=13.0,<14",
]
perf = [
    "locust>=2.20,<3",
]
scaffold = [
    "copier>=9.0,<10",
]

[project.scripts]
cadprice-mcp = "app.mcp.run:main"
cadprice = "app.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PIE", "RUF", "C4", "DTZ", "T20"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]  # Depends() in defaults is idiomatic FastAPI
"app/cli/**/*.py" = ["B008", "T20"]  # typer.Option()/Argument() in defaults is idiomatic; CLI needs print
"app/mcp/run.py" = ["T20"]  # CLI entry point needs print for error messages
"app/db/migrations/**" = ["E501", "I001"]  # Auto-generated migrations

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
