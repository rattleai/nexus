slug: slack
name: Slack
description: >-
  Connect to Slack for team messaging, channel management, and user
  information. Read channels, send messages, and access workspace data.
icon: MessageSquare
category: communication
connector_type: oauth_api
auth_type: oauth2
broker: composio
trust_level: verified
requires_app_credentials: true
version: "1.0.0"
documentation_url: https://api.slack.com/docs

tags:
  - slack
  - messaging
  - chat
  - team
  - communication

auth_config:
  authorize_url: https://slack.com/oauth/v2/authorize
  token_url: https://slack.com/api/oauth.v2.access
  userinfo_url: https://slack.com/api/auth.test
  revoke_url: https://slack.com/api/auth.revoke
  pkce_required: false
  scopes:
    - channels:read
    - chat:write
    - users:read
  extra_authorize_params: {}

api_config:
  api_base_url: https://slack.com/api
  default_headers:
    Content-Type: application/json; charset=utf-8
  rate_limit_header: Retry-After

mcp_config: {}

tool_definitions:
  - name: list_channels
    description: List all public channels in the workspace
    method: GET
    path: /conversations.list
    arg_location: query
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of channels to return
          default: 100
      required: []
  - name: send_message
    description: Send a message to a Slack channel
    method: POST
    path: /chat.postMessage
    arg_location: json_body
    input_schema:
      type: object
      properties:
        channel:
          type: string
          description: Channel ID to send the message to
        text:
          type: string
          description: Message text content
      required:
        - channel
        - text
  - name: list_users
    description: List all users in the workspace
    method: GET
    path: /users.list
    arg_location: query
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of users to return
          default: 100
      required: []

capability_template: {}
