slug: github
name: GitHub
description: >-
  Connect to GitHub for repository management, issue tracking, pull requests,
  and code review. Provides access to repositories, organizations, and user
  profile data.
icon: Github
category: developer_tools
connector_type: mcp_server
auth_type: oauth2
version: "1.0.0"
documentation_url: https://docs.github.com/en/developers/apps/building-oauth-apps

tags:
  - github
  - git
  - repositories
  - issues
  - pull-requests
  - developer

auth_config:
  authorize_url: https://github.com/login/oauth/authorize
  token_url: https://github.com/login/oauth/access_token
  userinfo_url: https://api.github.com/user
  revoke_url: https://api.github.com/applications/{client_id}/token
  redirect_uri: ""
  client_id: ""
  client_secret: ""
  pkce_required: false
  scopes:
    - repo
    - read:user
  extra_authorize_params: {}

mcp_config:
  transport: streamable_http
  server_url: ""

tool_definitions: []

capability_template: {}
