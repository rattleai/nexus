[alembic]
script_location = app/db/migrations
sqlalchemy.url = driver://user:pass@localhost/dbname

# version_locations is computed at runtime in app/db/migrations/env.py so it
# can include each enabled plugin's own migration tree at
# app/apps/<name>/migrations/versions/. See docs/PLUGINS.md.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
